<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ComicsTracker</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN — no build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root{
    --bg:#12141C; --bgAlt:#0E1017; --surface:#1B1E2A; --surface2:#242840;
    --border:#2E3348; --text:#ECEDF3; --textDim:#9297B0; --textFaint:#5D6280;
    --ink:#E8483C; --amber:#F0A93E; --teal:#4FC3B0;
  }
  html,body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .font-display{ font-family:'Anton',sans-serif; letter-spacing:.02em; }
  .font-mono{ font-family:'JetBrains Mono',monospace; }
  .halftone{
    background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
    background-size: 16px 16px; background-color: var(--bgAlt);
  }
  input, select, textarea{
    background:var(--bgAlt); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:14px; outline:none; width:100%;
  }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer; border:none; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-default{ background:var(--ink); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--textDim); border:1px solid var(--border); }
  .btn-subtle{ background:var(--surface2); color:var(--text); }
  .badge{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .row{ background:var(--bgAlt); border:1px solid var(--border); border-radius:8px; }
  .tab-btn{ display:flex; align-items:center; gap:6px; border-radius:8px; padding:8px 12px; font-size:14px; font-weight:600; color:var(--textDim); white-space:nowrap; }
  .tab-btn.active{ background:var(--ink); color:#fff; }
  .toast{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:10px; font-size:13px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  [data-lucide]{ width:15px; height:15px; }
</style>
</head>
<body>

<div id="gate" class="min-h-screen flex items-center justify-center px-4 hidden">
  <div class="card p-6 max-w-sm w-full text-center">
    <div class="flex items-center justify-center gap-2 mb-2" style="color:var(--ink)">
      <i data-lucide="book-open"></i>
      <span class="text-xs font-bold uppercase tracking-widest">Longbox</span>
    </div>
    <h1 class="font-display text-4xl mb-2">COMICSTRACKER</h1>
    <p class="text-sm mb-5" style="color:var(--textDim)">
      Your comics library, synced to your own Google Drive. Nothing is stored anywhere else.
    </p>
    <button id="connectBtn" class="btn btn-default w-full"><i data-lucide="log-in"></i> Connect Google Drive</button>
    <p id="gateStatus" class="text-xs mt-3" style="color:var(--textFaint)"></p>
  </div>
</div>

<div id="appRoot" class="hidden">
  <header class="halftone relative px-3 sm:px-6 py-8 sm:py-12" style="border-bottom:1px solid var(--border)">
    <div class="mx-auto max-w-5xl flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2" style="color:var(--ink)">
          <i data-lucide="book-open"></i>
          <span class="text-xs font-bold uppercase tracking-widest">Longbox</span>
        </div>
        <h1 class="font-display text-4xl sm:text-5xl mt-1" style="line-height:1">COMICSTRACKER</h1>
        <p class="text-sm mt-1" style="color:var(--textDim)">Your comics, tracked by series, publisher, and story order.</p>
      </div>
      <div class="flex gap-4 sm:gap-6 items-end">
        <div><div id="statRead" class="font-mono text-2xl font-bold" style="color:var(--ink)">0</div><div class="text-xs font-semibold uppercase" style="color:var(--textFaint)">Read</div></div>
        <div><div id="statOwned" class="font-mono text-2xl font-bold" style="color:var(--teal)">0</div><div class="text-xs font-semibold uppercase" style="color:var(--textFaint)">Owned</div></div>
        <div><div id="statWant" class="font-mono text-2xl font-bold" style="color:var(--amber)">0</div><div class="text-xs font-semibold uppercase" style="color:var(--textFaint)">Want</div></div>
        <div title="Completed series fully read & owned — stored in the separate archive file"><div id="statArchived" class="font-mono text-2xl font-bold" style="color:var(--textFaint)">0</div><div class="text-xs font-semibold uppercase" style="color:var(--textFaint)">Archived</div></div>
        <button id="connStatusBtn" class="btn btn-ghost" title="Drive connection status">
          <span id="connDot" class="inline-block w-2 h-2 rounded-full" style="background:var(--textFaint)"></span>
          <span id="connLabel" class="text-xs">Checking…</span>
        </button>
        <button id="refreshBtn" class="btn btn-ghost" title="Refresh from Drive"><i data-lucide="refresh-cw"></i></button>
        <button id="exportBtn" class="btn btn-ghost" title="Export records.json — for reference in a PullList chat"><i data-lucide="download"></i></button>
        <button id="signOutBtn" class="btn btn-ghost" title="Sign out"><i data-lucide="log-out"></i></button>
      </div>
    </div>
  </header>

  <nav id="tabNav" class="sticky top-0 z-10 flex gap-1 overflow-x-auto px-3 sm:px-6 py-2" style="background:var(--bgAlt); border-bottom:1px solid var(--border)"></nav>

  <main class="mx-auto max-w-5xl px-3 sm:px-6 py-5 sm:py-8" id="mainView"></main>
</div>

<script>
/* =========================================================
   CONFIG — fill these in after completing the Google Cloud
   Console setup (see the setup doc, section 3).
   ========================================================= */
const CONFIG = {
  CLIENT_ID: '669494100250-gvromuq72r7j0djmkd4vdbdq5damncj7.apps.googleusercontent.com',
  SCOPE: 'https://www.googleapis.com/auth/drive.file',    // single-user scope
  FILENAME: 'comicstracker-data.json',
  ARCHIVE_FILENAME: 'comicstracker-archive.json',
};

/* ---------- design helpers ---------- */
const PUBLISHER_PALETTE = {
  marvel:'#ED1D24', dc:'#2E5FAC', image:'#38C6E8', 'dark horse':'#8C5CE0',
  'boom! studios':'#F5A623', boom:'#F5A623', idw:'#3EC98A', dynamite:'#E0574A',
  vault:'#5FD1C4', valiant:'#D93B6C',
};
const FALLBACK_COLORS = ['#E8483C','#F0A93E','#4FC3B0','#9C7DE0','#38C6E8','#D93B6C','#5FD1C4','#F5A623'];
function publisherColor(name){
  const key=(name||'').trim().toLowerCase();
  if(PUBLISHER_PALETTE[key]) return PUBLISHER_PALETTE[key];
  let h=0; for(let i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
  return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO=()=>new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return 'TBD'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function statusOf(issue){ if(issue.read) return 'read'; if(issue.purchased) return 'owned'; return 'want'; }
const STATUS_META = {
  read:{label:'Read',color:'var(--ink)'}, owned:{label:'Owned · Unread',color:'var(--teal)'}, want:{label:'Want',color:'var(--amber)'}
};
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(name, extra){ return `<i data-lucide="${name}" ${extra||''}></i>`; }

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3200);
}

/* ---------- state ---------- */
const emptyData=()=>({series:[],issues:[],events:[],eras:[],families:[]});
const emptyActivePayload=()=>({series:[],issues:[],events:[],eras:[],families:[]});
const emptyArchivePayload=()=>({series:[],issues:[]});
let DATA = emptyData();
let currentTab = 'library';
let openSeriesId = null;
// 'alpha' | 'year-asc' | 'year-desc'
let librarySort = 'alpha';
let accessToken=null, tokenExpiry=0, fileId=null, archiveFileId=null, tokenClient=null;
let lastArchivedIds = new Set(); // tracks which series were in the archive file on last write, to skip redundant archive writes

// A series only moves to the archive file when BOTH are true:
// (1) status is 'completed', and (2) the user has explicitly checked "Archive this series".
// This is manual and intentional — no auto-archiving based on read/owned state.
function isArchivable(series){
  return series.status === 'completed' && series.archived === true;
}

/* =========================================================
   AUTH — Google Identity Services
   ========================================================= */
function initAuth(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPE,
    callback: onToken,
  });
  const cachedToken = localStorage.getItem('comicstracker_token');
  const cachedExpiry = Number(localStorage.getItem('comicstracker_token_expiry') || 0);
  if(cachedToken && cachedExpiry > Date.now() + 60000){
    accessToken = cachedToken; tokenExpiry = cachedExpiry;
    boot();
  } else {
    showGate();
  }
}
function showGate(){
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('appRoot').classList.add('hidden');
  lucide.createIcons();
}
function onToken(resp){
  if(resp.error){
    document.getElementById('gateStatus').textContent = 'Sign-in failed (' + resp.error + '). If this is your first time, double-check the OAuth origin matches this exact URL.';
    return;
  }
  accessToken = resp.access_token;
  tokenExpiry = Date.now() + (resp.expires_in*1000);
  localStorage.setItem('comicstracker_token', accessToken);
  localStorage.setItem('comicstracker_token_expiry', String(tokenExpiry));
  boot();
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('connectBtn').addEventListener('click', ()=>{
    document.getElementById('gateStatus').textContent = 'Opening Google sign-in…';
    tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
  });
  document.getElementById('signOutBtn').addEventListener('click', ()=>{
    localStorage.removeItem('comicstracker_token');
    localStorage.removeItem('comicstracker_token_expiry');
    accessToken=null;
    location.reload();
  });
  document.getElementById('refreshBtn').addEventListener('click', refreshFromDrive);
  document.getElementById('connStatusBtn').addEventListener('click', checkDriveConnection);
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'comicstracker-records.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Downloaded comicstracker-records.json — upload this in a PullList chat for reference.');
  });
  // GIS script loads async; poll until available then init
  const wait = setInterval(()=>{
    if(window.google && google.accounts && google.accounts.oauth2){
      clearInterval(wait);
      initAuth();
    }
  }, 100);
});

/* =========================================================
   DRIVE — read/write a single JSON file, same signatures
   regardless of backend (see setup doc §5d)
   ========================================================= */
async function driveFindFile(filename){
  const q = encodeURIComponent(`name='${filename}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`,
    { headers:{ Authorization:`Bearer ${accessToken}` } });
  if(!res.ok) throw new Error('Drive search failed: '+res.status);
  const json = await res.json();
  return (json.files && json.files[0]) ? json.files[0].id : null;
}
async function driveCreateFile(filename, content){
  const boundary='comicstracker_boundary';
  const metadata = { name: filename, mimeType:'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method:'POST',
    headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
  if(!res.ok) throw new Error('Drive create failed: '+res.status);
  const json = await res.json();
  return json.id;
}
async function driveReadFile(id){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
    { headers:{ Authorization:`Bearer ${accessToken}` } });
  if(!res.ok) throw new Error('Drive read failed: '+res.status);
  return await res.text();
}
async function driveWriteFile(id, content){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
    method:'PATCH',
    headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' },
    body: content,
  });
  if(!res.ok) throw new Error('Drive write failed: '+res.status);
}

/* ---------- connection checker ---------- */
let connCheckInFlight = false;
function setConnStatus(state, label){
  // state: 'ok' | 'bad' | 'checking'
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  if(!dot || !lbl) return;
  const color = state==='ok' ? 'var(--teal)' : state==='bad' ? 'var(--ink)' : 'var(--textFaint)';
  dot.style.background = color;
  lbl.textContent = label;
}
async function checkDriveConnection(){
  if(connCheckInFlight) return;
  connCheckInFlight = true;
  setConnStatus('checking', 'Checking…');
  try{
    if(!accessToken || tokenExpiry < Date.now()){ setConnStatus('bad', 'Disconnected'); return; }
    const res = await fetch('https://www.googleapis.com/drive/v3/about?fields=user', { headers:{ Authorization:`Bearer ${accessToken}` } });
    if(res.ok) setConnStatus('ok', 'Connected');
    else setConnStatus('bad', 'Disconnected');
  }catch(e){
    setConnStatus('bad', 'Disconnected');
  }finally{
    connCheckInFlight = false;
  }
}
async function refreshFromDrive(){
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.disabled = true;
  try{
    await checkDriveConnection();
    await loadAppData();
    render();
    toast('Refreshed from Drive.');
  }catch(e){
    toast("Couldn't refresh from Drive — check your connection.");
  }finally{
    if(btn) btn.disabled = false;
  }
}

async function resolveFileIds(){
  let archiveWasCreated = false;

  const cachedActive = localStorage.getItem('comicstracker_file_id');
  if(cachedActive){
    fileId = cachedActive;
  } else {
    let id = await driveFindFile(CONFIG.FILENAME);
    if(!id) id = await driveCreateFile(CONFIG.FILENAME, JSON.stringify(emptyActivePayload()));
    fileId = id;
    localStorage.setItem('comicstracker_file_id', fileId);
  }

  const cachedArchive = localStorage.getItem('comicstracker_archive_file_id');
  if(cachedArchive){
    archiveFileId = cachedArchive;
  } else {
    let id = await driveFindFile(CONFIG.ARCHIVE_FILENAME);
    if(!id){
      id = await driveCreateFile(CONFIG.ARCHIVE_FILENAME, JSON.stringify(emptyArchivePayload()));
      archiveWasCreated = true; // first time — existing data hasn't been split yet
    }
    archiveFileId = id;
    localStorage.setItem('comicstracker_archive_file_id', archiveFileId);
  }

  return archiveWasCreated;
}

async function loadAppData(){
  try{
    const [activeText, archiveText] = await Promise.all([
      driveReadFile(fileId),
      driveReadFile(archiveFileId),
    ]);
    const active = activeText ? JSON.parse(activeText) : emptyActivePayload();
    const archive = archiveText ? JSON.parse(archiveText) : emptyArchivePayload();
    DATA = {
      series: [...(active.series||[]), ...(archive.series||[])],
      issues: [...(active.issues||[]), ...(archive.issues||[])],
      events: active.events || [],
      eras: active.eras || [],
      families: active.families || [],
    };
    lastArchivedIds = new Set((archive.series||[]).map(s=>s.id));
  }catch(e){
    toast('Could not load your data from Drive — starting empty. Try reloading.');
    DATA = emptyData();
    lastArchivedIds = new Set();
  }
}
async function persist(){
  try{
    const archivedSeries = DATA.series.filter(isArchivable);
    const archivedIds = new Set(archivedSeries.map(s=>s.id));
    const activeSeries = DATA.series.filter(s=>!archivedIds.has(s.id));
    const archivedIssues = DATA.issues.filter(i=>archivedIds.has(i.seriesId));
    const activeIssues = DATA.issues.filter(i=>!archivedIds.has(i.seriesId));

    // Active file always gets written — this is the small, frequently-changing file
    const activePayload = { series: activeSeries, issues: activeIssues, events: DATA.events, eras: DATA.eras, families: DATA.families };
    await driveWriteFile(fileId, JSON.stringify(activePayload));

    // Archive file only gets rewritten when the set of archived series actually changed —
    // keeps writes cheap since this file only grows occasionally
    const idsChanged = archivedIds.size !== lastArchivedIds.size || [...archivedIds].some(id=>!lastArchivedIds.has(id));
    if(idsChanged){
      const archivePayload = { series: archivedSeries, issues: archivedIssues };
      await driveWriteFile(archiveFileId, JSON.stringify(archivePayload));
      lastArchivedIds = archivedIds;
    }
  }catch(e){
    toast("Couldn't save to Drive — check your connection.");
  }
}
function mutate(fn){ fn(DATA); render(); persist(); }

async function boot(){
  document.getElementById('gateStatus').textContent = 'Connecting to Drive…';
  try{
    const archiveWasCreated = await resolveFileIds();
    await loadAppData();
    if(archiveWasCreated){
      // First run with the two-file model — existing single-file data hasn't
      // been split yet. Force one persist now so completed+read+owned series
      // move into the new archive file immediately.
      await persist();
    }
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    renderNav();
    render();
    checkDriveConnection();
    setInterval(checkDriveConnection, 60000);
  }catch(e){
    document.getElementById('gateStatus').textContent = 'Could not reach Google Drive. Please retry.';
  }
}

/* =========================================================
   RENDER — nav, header stats, tab views
   ========================================================= */
const TABS = [
  {id:'library', label:'Library', icon:'library'},
  {id:'tracker', label:'Tracker', icon:'clock'},
  {id:'reading', label:'Reading Order', icon:'list-ordered'},
  {id:'events', label:'Events', icon:'tag'},
  {id:'groups', label:'Groups', icon:'layers'},
  {id:'import', label:'Import', icon:'upload'},
];
function renderNav(){
  const nav=document.getElementById('tabNav');
  nav.innerHTML = TABS.map(t=>`
    <button class="tab-btn ${currentTab===t.id?'active':''}" data-tab="${t.id}">
      ${icon(t.icon)} ${t.label}
    </button>`).join('');
  nav.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab=btn.dataset.tab; renderNav(); render(); });
  });
  lucide.createIcons();
}
function renderStats(){
  const total=DATA.issues.length;
  const read=DATA.issues.filter(i=>i.read).length;
  const owned=DATA.issues.filter(i=>i.purchased && !i.read).length;
  const want=DATA.issues.filter(i=>!i.purchased).length;
  const archived=DATA.series.filter(isArchivable).length;
  document.getElementById('statRead').textContent=read;
  document.getElementById('statOwned').textContent=owned;
  document.getElementById('statWant').textContent=want;
  document.getElementById('statArchived').textContent=archived;
}
function render(){
  const pageScrollY = window.scrollY;
  const importListEl = document.getElementById('importPreviewList');
  const importScrollTop = importListEl ? importListEl.scrollTop : null;

  renderStats();
  const main=document.getElementById('mainView');
  if(currentTab==='library') main.innerHTML = viewLibrary();
  else if(currentTab==='tracker') main.innerHTML = viewTracker();
  else if(currentTab==='reading') main.innerHTML = viewReading();
  else if(currentTab==='events') main.innerHTML = viewEvents();
  else if(currentTab==='groups') main.innerHTML = viewGroups();
  else if(currentTab==='import') main.innerHTML = viewImport();
  lucide.createIcons();
  wireEvents();

  window.scrollTo(0, pageScrollY);
  const importListEl2 = document.getElementById('importPreviewList');
  if(importListEl2 && importScrollTop!=null) importListEl2.scrollTop = importScrollTop;
}

/* ---------- Library helpers ---------- */
// Extract year from series name parenthetical, e.g. "X-Men (2021)" → 2021
// Falls back to the earliest issue release year, then 9999 for sorting.
function seriesYear(s){
  const m = (s.name||'').match(/\((\d{4})\)\s*$/);
  if(m) return parseInt(m[1],10);
  const issues = DATA.issues.filter(i=>i.seriesId===s.id);
  const dates = issues.map(i=>i.releaseDate).filter(Boolean).sort();
  if(dates.length) return parseInt(dates[0].slice(0,4),10);
  return 9999;
}
function sortSeries(list){
  const copy=[...list];
  if(librarySort==='alpha') return copy.sort((a,b)=>a.name.localeCompare(b.name));
  if(librarySort==='year-asc') return copy.sort((a,b)=>seriesYear(a)-seriesYear(b));
  if(librarySort==='year-desc') return copy.sort((a,b)=>seriesYear(b)-seriesYear(a));
  return copy;
}

/* ---------- Library ---------- */
const LIBRARY_STATUS_FILTERS = [
  {id:'', label:'All'}, {id:'read', label:'Read'}, {id:'owned', label:'Owned'}, {id:'want', label:'Want'}
];

// Builds just the series sections — called independently during search so focus isn't lost
function buildSeriesSections(){
  const statusFilter = window.__libraryStatusFilter || '';
  const hideCompleted = !!window.__hideCompleted;
  const hideLimited   = !!window.__hideLimited;
  const hideUpcoming  = !!window.__hideUpcoming;
  const hideArchived  = window.__hideArchived !== false; // defaults ON
  const collapsed = window.__collapsedPublishers || (window.__collapsedPublishers = new Set());
  const q=(window.__seriesQuery||'').toLowerCase();
  const subgroupMode = window.__librarySubgroup || 'publisher'; // 'publisher'|'era'|'family'

  // Series-status filter applied globally before grouping
  function applySeriesStatusFilter(list){
    let out = list;
    if(hideCompleted) out = out.filter(s=>s.status!=='completed');
    if(hideLimited)   out = out.filter(s=>s.status!=='limited');
    if(hideUpcoming)  out = out.filter(s=>s.status!=='upcoming');
    if(hideArchived)  out = out.filter(s=>!isArchivable(s));
    return out;
  }

  let out = '';

  if(subgroupMode === 'era' || subgroupMode === 'family'){
    const groups = {}; // groupKey -> [{series, color}]
    const ungrouped = [];
    applySeriesStatusFilter(DATA.series).forEach(s=>{
      const tagList = subgroupMode==='era' ? (s.eras||[]) : (s.families||[]);
      const defs = subgroupMode==='era' ? (DATA.eras||[]) : (DATA.families||[]);
      if(tagList.length===0){ ungrouped.push(s); return; }
      tagList.forEach(gid=>{
        const def = defs.find(g=>g.id===gid);
        const gname = def ? def.name : gid;
        (groups[gname] = groups[gname]||[]).push(s);
      });
    });
    const sorted = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
    if(ungrouped.length) sorted.push(['Ungrouped', ungrouped]);

    sorted.forEach(([gname, list])=>{
      let visible = q ? list.filter(s=>s.name.toLowerCase().includes(q)) : list;
      if(statusFilter) visible = visible.filter(s=>DATA.issues.some(i=>i.seriesId===s.id && statusOf(i)===statusFilter));
      visible = sortSeries(visible);
      if(visible.length===0) return;
      const collapseKey = `__subgroup__${gname}`;
      const isCollapsed = collapsed.has(collapseKey);
      const color = subgroupMode==='era'
        ? ((DATA.eras||[]).find(e=>e.name===gname)||{}).color || '#9C7DE0'
        : ((DATA.families||[]).find(f=>f.name===gname)||{}).color || '#38C6E8';
      out += `<section>
        <button class="flex items-center gap-2 mb-2 w-full text-left" data-toggle-publisher-collapse="${esc(collapseKey)}">
          ${icon(isCollapsed?'chevron-right':'chevron-down', `style="width:14px;height:14px;color:${color}"`)}
          <span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span>
          <h2 class="text-sm font-bold uppercase tracking-wide" style="color:${color}">${esc(gname)}</h2>
          <span class="text-xs" style="color:var(--textFaint)">${visible.length} series</span>
        </button>
        ${isCollapsed ? '' : `<div class="flex flex-col gap-2">${visible.map(s=>seriesRowHtml(s, color, statusFilter)).join('')}</div>`}
      </section>`;
    });
  } else {
    // Default: group by publisher
    const groups={};
    applySeriesStatusFilter(DATA.series).forEach(s=>{ const k=s.publisher||'Unknown'; (groups[k]=groups[k]||[]).push(s); });
    const publishers = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
    publishers.forEach(([publisher, list])=>{
      let visible = q ? list.filter(s=>s.name.toLowerCase().includes(q)) : list;
      if(statusFilter) visible = visible.filter(s=>DATA.issues.some(i=>i.seriesId===s.id && statusOf(i)===statusFilter));
      visible = sortSeries(visible);
      if(visible.length===0) return;
      const color = publisherColor(publisher);
      const isCollapsed = collapsed.has(publisher);
      out += `<section>
        <button class="flex items-center gap-2 mb-2 w-full text-left" data-toggle-publisher-collapse="${esc(publisher)}">
          ${icon(isCollapsed?'chevron-right':'chevron-down', `style="width:14px;height:14px;color:${color}"`)}
          <span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span>
          <h2 class="text-sm font-bold uppercase tracking-wide" style="color:${color}">${esc(publisher)}</h2>
          <span class="text-xs" style="color:var(--textFaint)">${visible.length} series</span>
        </button>
        ${isCollapsed ? '' : `<div class="flex flex-col gap-2">${visible.map(s=>seriesRowHtml(s, color, statusFilter)).join('')}</div>`}
      </section>`;
    });
  }
  return out || emptyState('No series match the current filters.');
}

/* ---------- Tracker ---------- */
function viewTracker(){
  const today=todayISO();
  const upcoming = DATA.issues.filter(i=>!i.read && (i.releaseDate ? i.releaseDate>=today || !i.purchased : true))
    .sort((a,b)=>(a.releaseDate||'9999').localeCompare(b.releaseDate||'9999'));
  if(upcoming.length===0) return emptyState("Nothing upcoming — everything's either read or has no future release date.");

  const groups={};
  upcoming.forEach(i=>{ const key=i.releaseDate?i.releaseDate.slice(0,7):'No date set'; (groups[key]=groups[key]||[]).push(i); });
  const delayed = DATA.issues.filter(i=>(i.dateHistory||[]).length>0 && !i.read);

  let html=`<div class="flex flex-col gap-6">`;
  if(delayed.length>0){
    html+=`<div class="rounded-xl p-3" style="background:#F0A93E15;border:1px solid #F0A93E55">
      <div class="flex items-center gap-1.5 text-sm font-bold mb-1" style="color:var(--amber)">${icon('alert-triangle')} ${delayed.length} delayed release${delayed.length>1?'s':''}</div>
      <div class="text-xs" style="color:var(--textDim)">Dates below reflect the latest update; original dates are kept in history.</div>
    </div>`;
  }
  Object.entries(groups).forEach(([month, items])=>{
    const label = month==='No date set' ? month : new Date(month+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
    html+=`<section>
      <h3 class="font-mono text-sm font-bold uppercase tracking-wide mb-2" style="color:var(--textDim)">${label}</h3>
      <div class="flex flex-col gap-1.5">${items.map(i=>issueRowHtml(i,true)).join('')}</div>
    </section>`;
  });
  html+=`</div>`;
  return html;
}

/* ---------- Reading Order ---------- */
function issueSeries(i){ return DATA.series.find(s=>s.id===i.seriesId); }
function issuePublisher(i){ const s=issueSeries(i); return s ? (s.publisher||'Unknown') : 'Unknown'; }
function viewReading(){
  const includeUnowned = !!window.__includeUnowned;
  const pubFilter = window.__readingPublisherFilter || '';
  let eventFilter = window.__eventFilter || '';

  const allPublishers = Array.from(new Set(DATA.series.map(s=>s.publisher||'Unknown'))).sort((a,b)=>a.localeCompare(b));

  // events relevant to the current publisher filter, sorted by earliest issue release date
  const relevantEvents = DATA.events
    .map(ev=>{
      let evIssues = DATA.issues.filter(i=>(i.eventIds||[]).includes(ev.id));
      if(pubFilter) evIssues = evIssues.filter(i=>issuePublisher(i)===pubFilter);
      const earliest = evIssues.reduce((min,i)=> (i.releaseDate && (!min || i.releaseDate<min)) ? i.releaseDate : min, null);
      return {ev, count: evIssues.length, earliest};
    })
    .filter(x=>x.count>0)
    .sort((a,b)=>(a.earliest||'9999').localeCompare(b.earliest||'9999'));
  // if the selected event no longer applies under the new publisher filter, clear it
  if(eventFilter && !relevantEvents.find(x=>x.ev.id===eventFilter)){ eventFilter=''; window.__eventFilter=''; }

  let items = DATA.issues.filter(i=> includeUnowned ? true : i.purchased);
  if(pubFilter) items = items.filter(i=>issuePublisher(i)===pubFilter);
  if(eventFilter) items = items.filter(i=>(i.eventIds||[]).includes(eventFilter));
  items = items.sort((a,b)=>{
    const ra=a.readOrder??null, rb=b.readOrder??null;
    if(ra!=null && rb!=null) return ra-rb;
    if(ra!=null) return -1;
    if(rb!=null) return 1;
    return (a.releaseDate||'9999').localeCompare(b.releaseDate||'9999');
  });
  const nextUp = items.find(i=>!i.read);

  let html=`<div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-2">
      <button class="btn ${includeUnowned?'btn-default':'btn-ghost'}" id="toggleIncludeUnowned">${icon(includeUnowned?'eye':'eye-off')} ${includeUnowned?'Showing all':'Owned only'}</button>
      <select id="readingPublisherFilter" style="width:auto">
        <option value="">All publishers</option>
        ${allPublishers.map(p=>`<option value="${esc(p)}" ${pubFilter===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>
      <select id="eventFilterSelect" style="width:auto">
        <option value="">All events</option>
        ${relevantEvents.map(x=>`<option value="${x.ev.id}" ${eventFilter===x.ev.id?'selected':''}>${esc(x.ev.name)}</option>`).join('')}
      </select>
      <span class="text-xs" style="color:var(--textFaint)">Set a reading order number on any issue to pin its position; unpinned issues fall back to release date.</span>
    </div>`;
  if(nextUp){
    const s=DATA.series.find(s=>s.id===nextUp.seriesId);
    html+=`<div class="rounded-xl p-4" style="background:#E8483C18;border:1px solid #E8483C55">
      <div class="text-xs font-bold uppercase tracking-wide" style="color:var(--ink)">Next up</div>
      <div class="text-lg font-semibold mt-1">${esc(s?s.name:'Unknown')} #${esc(nextUp.number)}${nextUp.title?' — '+esc(nextUp.title):''}</div>
    </div>`;
  }
  if(items.length===0){
    html+=emptyState('Nothing here yet. Mark issues as owned or include unowned to build a reading order.');
  } else {
    html+=`<div class="flex flex-col gap-1.5">${items.map((issue,idx)=>readingRowHtml(issue, idx+1)).join('')}</div>`;
  }
  html+=`</div>`;
  return html;
}
function readingRowHtml(issue, index){
  const series = DATA.series.find(s=>s.id===issue.seriesId);
  const color = publisherColor(series?series.publisher:'');
  return `<div class="flex items-center gap-3 rounded-lg px-3 py-2" style="background:${issue.read?'var(--bgAlt)':'var(--surface)'};border:1px solid var(--border);opacity:${issue.read?0.55:1}">
    <button class="flex items-center justify-center w-6 h-6 rounded-full shrink-0" style="border:2px solid ${issue.read?'var(--ink)':'var(--border)'};background:${issue.read?'var(--ink)':'transparent'}" data-toggle-read-order="${issue.id}">
      ${issue.read?icon('check',`style="width:13px;height:13px;color:#fff"`):''}
    </button>
    <span class="font-mono text-xs w-6 text-right shrink-0" style="color:var(--textFaint)">${index}</span>
    <span class="w-2 h-2 rounded-full shrink-0" style="background:${color}"></span>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-medium truncate">${esc(series?series.name:'')} <span style="color:var(--textFaint)">#${esc(issue.number)}</span></div>
      ${issue.title?`<div class="text-xs truncate" style="color:var(--textFaint)">${esc(issue.title)}</div>`:''}
    </div>
    <div class="font-mono text-xs shrink-0" style="color:var(--textFaint)">
      <button class="underline decoration-dotted" data-edit-order="${issue.id}">${issue.readOrder!=null?'#'+issue.readOrder:'set order'}</button>
    </div>
  </div>`;
}

/* ---------- Events ---------- */
function eventIssues(evId){
  return DATA.issues.filter(i=>(i.eventIds||[]).includes(evId)).sort((a,b)=>(a.releaseDate||'9999').localeCompare(b.releaseDate||'9999'));
}
function eventPublishers(evId){
  const pubs = new Set();
  eventIssues(evId).forEach(i=>{ const s=DATA.series.find(s=>s.id===i.seriesId); if(s) pubs.add(s.publisher||'Unknown'); });
  return pubs;
}
function viewEvents(){
  const pubFilter = window.__eventPublisherFilter || '';
  const allPublishers = Array.from(new Set(DATA.series.map(s=>s.publisher||'Unknown'))).sort((a,b)=>a.localeCompare(b));

  let html=`<div class="flex flex-col gap-5">
    <div class="card p-4">
      <label class="flex flex-col gap-1 text-sm"><span class="font-semibold" style="color:var(--textDim)">New crossover / event name</span>
        <div class="flex gap-2">
          <input id="newEventName" placeholder="e.g. Fall of the House of X" />
          <button class="btn btn-default" id="saveNewEvent">${icon('plus')} Add</button>
        </div>
      </label>
    </div>`;
  if(DATA.events.length===0){
    html+=emptyState('No events tagged yet. Create one, then tag it onto issues across any series in the Library.');
  } else {
    if(allPublishers.length>0){
      html+=`<div class="flex items-center gap-2">
        <span class="text-xs font-semibold" style="color:var(--textDim)">Publisher</span>
        <select id="eventPublisherFilter" style="width:auto">
          <option value="">All publishers</option>
          ${allPublishers.map(p=>`<option value="${esc(p)}" ${pubFilter===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
      </div>`;
    }
    const visibleEvents = pubFilter ? DATA.events.filter(ev=>eventPublishers(ev.id).has(pubFilter)) : DATA.events;
    // Collapsed by default: seed the set with all event IDs the first time
    if(!window.__collapsedEventsInited){
      window.__collapsedEventsInited = true;
      window.__collapsedEvents = new Set(DATA.events.map(e=>e.id));
    }
    const collapsedEvs = window.__collapsedEvents || (window.__collapsedEvents = new Set(DATA.events.map(e=>e.id)));
    if(visibleEvents.length===0){
      html+=emptyState('No events tagged for this publisher yet.');
    } else {
      html+=`<div class="flex flex-col gap-2">`;
      visibleEvents.forEach(ev=>{
        const issues = eventIssues(ev.id);
        const isOpen = !collapsedEvs.has(ev.id);
        const readCount = issues.filter(i=>i.read).length;
        html+=`<div class="card">
          <button class="w-full flex items-center justify-between gap-3 px-4 py-3 text-left" data-toggle-event-collapse="${ev.id}">
            <div class="flex items-center gap-2 min-w-0">
              ${icon(isOpen?'chevron-down':'chevron-right',`style="width:13px;height:13px;color:${ev.color}"`)}
              <span class="badge" style="background:${ev.color}22;color:${ev.color};border:1px solid ${ev.color}55">${esc(ev.name)}</span>
              <span class="text-xs" style="color:var(--textFaint)">${issues.length} issue${issues.length!==1?'s':''}</span>
            </div>
            <span class="font-mono text-xs shrink-0" style="color:var(--textDim)">${readCount}/${issues.length} read</span>
          </button>
          ${isOpen ? `<div class="px-4 pb-4">
            <div class="flex flex-wrap gap-2 mb-3">
              ${issues.length>0?`<button class="btn btn-subtle" data-mark-event-owned="${ev.id}">${icon('package')} Mark all owned</button>
              <button class="btn btn-subtle" data-mark-event-read="${ev.id}">${icon('eye')} Mark all read</button>`:''}
              <button class="btn btn-ghost" data-delete-event="${ev.id}">${icon('trash-2')} Delete event</button>
            </div>
            ${issues.length===0? `<div class="text-xs" style="color:var(--textFaint)">No issues tagged with this event yet.</div>`
              : `<div class="flex flex-col gap-1">${issues.map(i=>{
                  const s=DATA.series.find(s=>s.id===i.seriesId);
                  return `<div class="flex items-center justify-between text-sm rounded px-2 py-1" style="background:var(--bgAlt)">
                    <span>${esc(s?s.name:'')} <span style="color:var(--textFaint)">#${esc(i.number)}</span></span>
                    <span class="font-mono text-xs" style="color:var(--textFaint)">${fmtDate(i.releaseDate)}</span>
                  </div>`;
                }).join('')}</div>`}
          </div>` : ''}
        </div>`;
      });
      html+=`</div>`;
    }
  }
  html+=`</div>`;
  return html;
}

/* ---------- Groups (Eras & Families) ---------- */
function viewGroups(){
  const collapsedG = window.__collapsedGroups || (window.__collapsedGroups = new Set());
  function groupBlock(type, label, icon_name, defs, assignKey){
    const allSeries = DATA.series;
    let html = `<div class="card p-4 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="font-semibold flex items-center gap-2">${icon(icon_name)} ${label}</div>
        <div class="flex gap-2 items-center">
          <input id="new${type}Name" placeholder="New ${label.toLowerCase()} name…" style="width:180px" />
          <input id="new${type}Color" type="color" value="#9C7DE0" style="width:36px;height:36px;padding:2px;border-radius:6px;cursor:pointer" />
          <button class="btn btn-default" id="save${type}">${icon('plus')} Add</button>
        </div>
      </div>`;
    if(defs.length===0){
      html += emptyState(`No ${label.toLowerCase()}s defined yet.`, true);
    } else {
      html += `<div class="flex flex-col gap-3">`;
      defs.forEach(g=>{
        const isOpen = !collapsedG.has(`${type}-${g.id}`);
        const members = allSeries.filter(s=>(s[assignKey]||[]).includes(g.id));
        const nonMembers = allSeries.filter(s=>!(s[assignKey]||[]).includes(g.id));
        html += `<div class="rounded-lg p-3" style="background:var(--bgAlt);border:1px solid var(--border)">
          <div class="flex items-center gap-2 justify-between">
            <button class="flex items-center gap-2" data-toggle-group-collapse="${type}-${g.id}">
              ${icon(isOpen?'chevron-down':'chevron-right',`style="width:13px;height:13px;color:${g.color}"`)}
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${g.color}"></span>
              <span class="font-semibold text-sm">${esc(g.name)}</span>
              <span class="text-xs" style="color:var(--textFaint)">${members.length} series</span>
            </button>
            <button class="btn btn-ghost text-xs" data-delete-group="${type}" data-delete-group-id="${g.id}">${icon('trash-2')}</button>
          </div>
          ${isOpen ? `<div class="mt-3 flex flex-col gap-1">
            ${members.length===0 ? `<div class="text-xs" style="color:var(--textFaint)">No series assigned yet.</div>` : ''}
            ${members.map(s=>`<div class="flex items-center justify-between rounded px-2 py-1 text-sm" style="background:var(--surface)">
              <span>${esc(s.name)}</span>
              <button class="btn btn-ghost text-xs" data-unassign-group="${type}" data-unassign-id="${s.id}" data-group-id="${g.id}">${icon('x')} Remove</button>
            </div>`).join('')}
            ${nonMembers.length>0 ? `<div class="mt-1">
              <select id="assign-${type}-${g.id}" style="width:auto">
                <option value="">Add a series…</option>
                ${nonMembers.sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
              </select>
            </div>` : ''}
          </div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }
  return `<div class="flex flex-col gap-6">
    <div class="text-sm" style="color:var(--textDim)">
      Define <strong style="color:var(--text)">Eras</strong> (e.g. Pre-Flashpoint, New 52) and <strong style="color:var(--text)">Families</strong> (e.g. Batman titles, Spider-Man titles) to sub-group series in the Library.
      A series can belong to multiple eras or families. Switch grouping in Library → Group dropdown.
    </div>
    ${groupBlock('Era','Eras','clock',DATA.eras||[],'eras')}
    ${groupBlock('Family','Families','users',DATA.families||[],'families')}
  </div>`;
}

/* ---------- Import ---------- */
function viewImport(){
  const doneMsg = window.__importDone ? `<span class="text-xs self-center" style="color:var(--teal)">Imported ${window.__importDone} issue${window.__importDone>1?'s':''}${window.__importMerged?` (${window.__importMerged} merged into existing issues)`:''}.</span>` : '';
  const preview = window.__importPreview || [];
  let html = `<div class="flex flex-col gap-4">
    <div class="card p-4">
      <div class="text-sm font-semibold mb-2">Bulk import upcoming or past issues</div>
      <div class="text-xs mb-3 leading-relaxed" style="color:var(--textDim)">
        <strong style="color:var(--text)">Upload a PullList .json file</strong> (the output of a PullList research request) — easiest, and handles titles with special characters cleanly.
        Or paste manually, one issue per line, separated by <code>|</code>:<br/>
        <span class="font-mono">Series Name | Issue # | Title | Publisher | YYYY-MM-DD | Event1,Event2 | ReadingOrder#</span><br/>
        Only the series name is required. Matching series names are reused; new ones and new event tags are created automatically.
        The last column is optional — a number that pins this issue's position in the Reading Order tab (useful for event tie-ins that don't sort cleanly by date).<br/>
        <strong style="color:var(--text)">If an issue already exists</strong> (same series + issue #), it's updated in place rather than duplicated — event tags are merged in, and title/date/reading order are filled only where blank, so your existing read/owned status and any date-delay history are preserved.
      </div>
      <textarea id="importText" rows="7" class="font-mono" placeholder="Nightwing | 120 | Fear State Tie-in | DC | 2026-09-16 | Fear State | 4">${esc(window.__importText||'')}</textarea>
      <div class="mt-3 flex gap-2 items-center flex-wrap">
        <button class="btn btn-default" id="previewImport">${icon('search')} Preview</button>
        <span class="text-xs" style="color:var(--textFaint)">or</span>
        <label class="btn btn-subtle" style="cursor:pointer">${icon('upload')} Upload PullList .json
          <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
        </label>
        ${doneMsg}
      </div>
      ${window.__importError? `<div class="text-xs mt-2" style="color:var(--ink)">${esc(window.__importError)}</div>`:''}
    </div>`;
  if(preview.length>0){
    const included = preview.filter(r=>r.__include!==false);
    const mergeCount = included.filter(r=>r.__willMerge).length;
    const newSeriesCount = included.filter(r=>!r.__willMerge && !r.__matchedSeriesId).length;
    const existingSeriesCount = included.filter(r=>!r.__willMerge && r.__matchedSeriesId).length;
    html+=`<div class="card p-4">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <div class="text-sm font-semibold">Preview — ${preview.length} row${preview.length>1?'s':''}
          <span class="font-normal text-xs" style="color:var(--textFaint)">(${included.length} selected: ${existingSeriesCount} to existing series, ${newSeriesCount} new series${mergeCount>0?`, ${mergeCount} will update existing issues`:''})</span>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-ghost" id="selectAllImport" style="font-size:12px;padding:4px 10px">Select all</button>
          <button class="btn btn-ghost" id="selectNoneImport" style="font-size:12px;padding:4px 10px">Select none</button>
        </div>
      </div>
      <div class="text-xs mb-2" style="color:var(--textFaint)">Edit any field before importing. Uncheck a row to exclude it. Changes here don't touch your data until you click Import.</div>
      <div id="importPreviewList" class="flex flex-col gap-1.5 max-h-[32rem] overflow-y-auto">
        ${preview.map((r,idx)=>{
          const excluded = r.__include===false;
          const matchedSeries = r.__matchedSeriesId ? DATA.series.find(s=>s.id===r.__matchedSeriesId) : null;
          const matchedIssueCount = matchedSeries ? DATA.issues.filter(i=>i.seriesId===matchedSeries.id).length : 0;
          let badgeLabel, badgeColor;
          if(r.__willMerge){ badgeLabel='merge'; badgeColor='var(--amber)'; }
          else if(matchedSeries){ badgeLabel='existing series'; badgeColor='#4FC3B0'; }
          else { badgeLabel='new series'; badgeColor='var(--purple, #9C7DE0)'; }
          return `<div class="flex flex-col gap-1.5 rounded px-2 py-2" style="background:var(--bgAlt);border:1px solid var(--border);opacity:${excluded?0.45:1}" data-import-row="${idx}">
            <div class="flex items-start gap-2">
              <input type="checkbox" data-import-include="${idx}" ${excluded?'':'checked'} style="width:16px;height:16px;margin-top:6px;flex-shrink:0" />
              <div class="grid gap-1.5" style="flex:1;grid-template-columns:2fr 0.6fr 1fr;min-width:0">
                <div style="grid-column:1/2">
                  <input type="text" data-import-field="${idx}:seriesName" value="${esc(r.seriesName)}" placeholder="Series name" class="font-mono" style="font-size:12px;padding:4px 6px;width:100%" />
                  ${r.__fuzzyMatched ? `<div class="text-xs mt-0.5" style="color:var(--amber)">≈ auto-matched from "${esc(r.__originalSeriesName)}"</div>` : ''}
                  ${matchedSeries && !r.__willMerge ? `<div class="text-xs mt-0.5" style="color:#4FC3B0">→ adding to existing series (${matchedIssueCount} issue${matchedIssueCount!==1?'s':''} already tracked)</div>` : ''}
                  ${!matchedSeries ? `<div class="text-xs mt-0.5" style="color:var(--purple, #9C7DE0)">⭐ will create a new series</div>` : ''}
                </div>
                <input type="text" data-import-field="${idx}:number" value="${esc(r.number)}" placeholder="#" class="font-mono" style="font-size:12px;padding:4px 6px" />
                <input type="text" data-import-field="${idx}:publisher" value="${esc(r.publisher)}" placeholder="Publisher" class="font-mono" style="font-size:12px;padding:4px 6px" />
                <input type="text" data-import-field="${idx}:title" value="${esc(r.title)}" placeholder="Title (optional)" class="font-mono" style="font-size:12px;padding:4px 6px;grid-column:1/3" />
                <input type="text" data-import-field="${idx}:releaseDate" value="${esc(r.releaseDate)}" placeholder="YYYY-MM-DD" class="font-mono" style="font-size:12px;padding:4px 6px" />
                <input type="text" data-import-field="${idx}:events" value="${esc((r.events||[]).join(', '))}" placeholder="Events, comma-separated" class="font-mono" style="font-size:12px;padding:4px 6px;grid-column:1/3" />
                <input type="text" data-import-field="${idx}:readOrder" value="${r.readOrder!=null?esc(String(r.readOrder)):''}" placeholder="Read order #" class="font-mono" style="font-size:12px;padding:4px 6px" />
              </div>
              <span class="badge shrink-0" style="margin-top:4px;background:${badgeColor}22;color:${badgeColor};border:1px solid ${badgeColor}55">${badgeLabel}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="mt-3"><button class="btn btn-default" id="doImport" ${included.length===0?'disabled':''}>${icon('check')} Import selected (${included.length})</button></div>
    </div>`;
  }
  html+=`</div>`;
  return html;
}

/* =========================================================
   EVENT WIRING (delegation on #mainView, plus a few globals)
   ========================================================= */

// Wire only the series-level events (used after partial DOM re-render of libSeriesContainer)
function wireSeriesEvents(main){
  main.querySelectorAll('[data-toggle-publisher-collapse]').forEach(el=>el.addEventListener('click', ()=>{
    const pub = el.dataset.togglePublisherCollapse;
    const set = window.__collapsedPublishers || (window.__collapsedPublishers = new Set());
    if(set.has(pub)) set.delete(pub); else set.add(pub);
    const container = document.getElementById('libSeriesContainer');
    if(container){ container.innerHTML = buildSeriesSections(); lucide.createIcons(); wireSeriesEvents(main); }
    else render();
  }));
  main.querySelectorAll('[data-toggle-series]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.toggleSeries; openSeriesId = openSeriesId===id?null:id; window.__showIssueForm=null; render();
  }));
  main.querySelectorAll('[data-mark-series-owned]').forEach(el=>el.addEventListener('click', ()=>{
    const sid=el.dataset.markSeriesOwned;
    mutate(d=>{ d.issues.forEach(i=>{ if(i.seriesId===sid) i.purchased=true; }); });
    toast('Marked all issues in this series as owned.');
  }));
  main.querySelectorAll('[data-mark-series-read]').forEach(el=>el.addEventListener('click', ()=>{
    const sid=el.dataset.markSeriesRead;
    mutate(d=>{ d.issues.forEach(i=>{ if(i.seriesId===sid){ i.read=true; i.purchased=true; } }); });
    toast('Marked all issues in this series as read.');
  }));
  main.querySelectorAll('[data-delete-series]').forEach(el=>el.addEventListener('click', ()=>{
    if(el.dataset.confirming){
      const id=el.dataset.deleteSeries;
      mutate(d=>{ d.series=d.series.filter(s=>s.id!==id); d.issues=d.issues.filter(i=>i.seriesId!==id); });
      openSeriesId=null; render();
    } else {
      el.dataset.confirming='1'; el.innerHTML = `${icon('trash-2')} Confirm delete?`; lucide.createIcons();
    }
  }));
  main.querySelectorAll('[data-cycle-series-status]').forEach(el=>el.addEventListener('click', ()=>{
    const sid=el.dataset.cycleSeriesStatus;
    const cur=el.dataset.currentStatus||'ongoing';
    const next = cur==='upcoming'?'ongoing': cur==='ongoing'?'limited': cur==='limited'?'completed':'upcoming';
    mutate(d=>{ const s=d.series.find(x=>x.id===sid); if(s) s.status=next; });
  }));
  main.querySelectorAll('[data-toggle-archive]').forEach(el=>el.addEventListener('click', ()=>{
    const sid=el.dataset.toggleArchive;
    mutate(d=>{ const s=d.series.find(x=>x.id===sid); if(s && s.status==='completed') s.archived=!s.archived; });
  }));
  main.querySelectorAll('[data-rename-series]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.renameSeries; window.__showRenameForm = window.__showRenameForm===id?null:id; render();
  }));
  main.querySelectorAll('[data-confirm-rename]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.confirmRename;
    const newName=document.getElementById('renameSeriesInput').value.trim();
    if(!newName) return;
    mutate(d=>{ const s=d.series.find(x=>x.id===id); if(s) s.name=newName; });
    window.__showRenameForm=null;
  }));
  const cancelRename=document.getElementById('cancelRename');
  if(cancelRename) cancelRename.addEventListener('click',()=>{ window.__showRenameForm=null; render(); });
  main.querySelectorAll('[data-tag-event-issue]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.tagEventIssue;
    window.__tagEventIssueId = window.__tagEventIssueId===id ? null : id; render();
  }));
  main.querySelectorAll('[data-toggle-issue-event]').forEach(el=>el.addEventListener('click', ()=>{
    const issueId=el.dataset.toggleIssueEvent; const evId=el.dataset.eventId;
    mutate(d=>{ const i=d.issues.find(x=>x.id===issueId); if(!i) return;
      i.eventIds=i.eventIds||[];
      const idx=i.eventIds.indexOf(evId);
      if(idx>=0) i.eventIds.splice(idx,1); else i.eventIds.push(evId);
    });
  }));
  main.querySelectorAll('[data-close-tag-event]').forEach(el=>el.addEventListener('click', ()=>{
    window.__tagEventIssueId=null; render();
  }));
  main.querySelectorAll('[data-toggle-issue-form]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.toggleIssueForm; window.__showIssueForm = window.__showIssueForm===id?null:id; render();
  }));
  main.querySelectorAll('[data-toggle-purchased]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.togglePurchased;
    mutate(d=>{ const i=d.issues.find(x=>x.id===id); if(!i) return;
      const newPurchased=!i.purchased; i.purchased=newPurchased; if(!newPurchased) i.read=false; });
  }));
  main.querySelectorAll('[data-toggle-read]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.toggleRead;
    mutate(d=>{ const i=d.issues.find(x=>x.id===id); if(!i) return; i.read=!i.read; if(i.read) i.purchased=true; });
  }));
  main.querySelectorAll('[data-delete-issue]').forEach(el=>el.addEventListener('click', ()=>{
    mutate(d=>{ d.issues=d.issues.filter(i=>i.id!==el.dataset.deleteIssue); });
  }));
  main.querySelectorAll('[data-edit-date]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.editDate;
    const issue = DATA.issues.find(i=>i.id===id);
    const wrap=document.createElement('span'); wrap.className='inline-flex items-center gap-1';
    wrap.innerHTML = `<input type="date" value="${issue.releaseDate||''}" style="padding:2px 6px;font-size:12px;width:auto" id="dateEdit-${id}" />
      <button data-confirm-date="${id}" style="color:var(--teal)">${icon('check',`style="width:13px;height:13px"`)}</button>`;
    el.replaceWith(wrap);
    lucide.createIcons();
    wrap.querySelector(`[data-confirm-date]`).addEventListener('click', ()=>{
      const newDate = document.getElementById(`dateEdit-${id}`).value;
      mutate(d=>{
        const i=d.issues.find(x=>x.id===id); if(!i) return;
        i.dateHistory = i.dateHistory||[];
        i.dateHistory.push({date:i.releaseDate, note:'delayed', changedOn: todayISO()});
        i.releaseDate = newDate;
      });
    });
  }));
}

function wireEvents(){
  const main=document.getElementById('mainView');

  // Library — search: update query + re-render only the series list to avoid losing focus
  const searchInput = document.getElementById('seriesSearch');
  if(searchInput) searchInput.addEventListener('input', e=>{
    window.__seriesQuery = e.target.value;
    const container = document.getElementById('libSeriesContainer');
    if(container){ container.innerHTML = buildSeriesSections(); lucide.createIcons(); wireSeriesEvents(main); }
    else render();
  });
  const librarySortSelect = document.getElementById('librarySortSelect');

  // Import
  // Normalizes a series name for comparison: lowercase, strip trailing "(YYYY)",
  // strip leading articles, strip punctuation, collapse whitespace.
  function normalizeSeriesName(name){
    return (name||'').toLowerCase()
      .replace(/\s*\(\d{4}\)\s*$/, '')
      .replace(/^(the|an|a)\s+/, '')
      .replace(/[:\-–—''".,!]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function levenshtein(a, b){
    const m=a.length, n=b.length;
    if(m===0) return n; if(n===0) return m;
    const dp = Array.from({length:m+1}, (_,i)=>{ const row=new Array(n+1); row[0]=i; return row; });
    for(let j=0;j<=n;j++) dp[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    return dp[m][n];
  }
  function nameSimilarity(a, b){
    const dist = levenshtein(a, b);
    const maxLen = Math.max(a.length, b.length) || 1;
    return 1 - dist / maxLen;
  }
  const FUZZY_THRESHOLD = 0.82;
  const SINGLE_WORD_FUZZY_THRESHOLD = 0.93; // single-word names need a much higher bar — a one-character
    // edit on a short word (e.g. "Catwoman" vs "Batwoman") can score 87%+ similar despite being
    // completely different titles; multi-word names are safer because other words anchor the match.
  // Finds the best matching existing series for a raw imported series name.
  // Tries exact match first (after normalization), then falls back to
  // edit-distance similarity — catches typos, singular/plural drift, and
  // unstripped year parentheticals like "Doctor Strange" vs "Doctors Strange (2026)".
  function findSeriesMatch(rawName, publisher){
    const norm = normalizeSeriesName(rawName);
    if(!norm) return {series:null, type:null};
    let candidates = DATA.series;
    if(publisher){
      const pubMatch = candidates.filter(s=>(s.publisher||'').toLowerCase()===publisher.toLowerCase());
      if(pubMatch.length) candidates = pubMatch; // narrow to same publisher when we can, avoids cross-publisher false positives
    }
    const threshold = norm.includes(' ') ? FUZZY_THRESHOLD : SINGLE_WORD_FUZZY_THRESHOLD;
    let best=null, bestScore=0;
    for(const s of candidates){
      const sNorm = normalizeSeriesName(s.name);
      if(sNorm===norm) return {series:s, type:'exact'};
      const score = nameSimilarity(norm, sNorm);
      if(score>bestScore){ bestScore=score; best=s; }
    }
    if(best && bestScore>=threshold) return {series:best, type:'fuzzy', score:bestScore};
    return {series:null, type:null};
  }
  function computeWillMerge(row){
    const series = DATA.series.find(s=>s.name.toLowerCase()===row.seriesName.toLowerCase());
    const existing = series ? DATA.issues.find(i=>i.seriesId===series.id && i.number.toLowerCase()===row.number.toLowerCase()) : null;
    return !!existing;
  }
  function setImportPreview(rows){
    // normalize + flag rows that will merge into an existing issue (same series name + issue number)
    // Accepts both camelCase (ComicsTracker's native format) and snake_case / alternate
    // key names (common in other tools' export, e.g. PullList variants).
    rows.forEach(row=>{
      row.seriesName = (row.seriesName||row.series||row.series_name||'').toString().trim();
      row.number = (row.number!=null?row.number : row.issue!=null?row.issue : row.issue_number!=null?row.issue_number : '').toString().trim();
      row.title = (row.title||'').toString().trim();
      row.publisher = (row.publisher||'').toString().trim();
      row.releaseDate = (row.releaseDate||row.release_date||row.date||'').toString().trim();
      const rawEvents = row.events || row.event_tags || row.eventTags;
      row.events = Array.isArray(rawEvents) ? rawEvents.filter(Boolean) : (rawEvents ? String(rawEvents).split(',').map(e=>e.trim()).filter(Boolean) : []);
      const rawOrder = row.readOrder!=null ? row.readOrder : (row.reading_order!=null ? row.reading_order : row.read_order);
      row.readOrder = (rawOrder!=null && rawOrder!=='' && !isNaN(Number(rawOrder))) ? Number(rawOrder) : null;

      // Match the series name against existing series (exact or fuzzy). If it's a
      // fuzzy (non-exact) match, auto-correct the field to the canonical name and
      // flag it so the row shows a note — user can retype to override.
      // __matchedSeriesId tracks whether ANY existing series was found, so the
      // preview can show "adding to existing series" vs "will create new series".
      row.__fuzzyMatched = false;
      row.__originalSeriesName = null;
      row.__matchedSeriesId = null;
      if(row.seriesName){
        const match = findSeriesMatch(row.seriesName, row.publisher);
        if(match.type==='fuzzy'){
          row.__originalSeriesName = row.seriesName;
          row.seriesName = match.series.name;
          row.__fuzzyMatched = true;
          row.__matchedSeriesId = match.series.id;
        } else if(match.type==='exact'){
          row.__matchedSeriesId = match.series.id;
        }
      }

      row.__willMerge = computeWillMerge(row);
      row.__include = true;
    });
    window.__importPreview = rows.filter(r=>r.seriesName); window.__importDone=0; render();
  }

            row.__fuzzyMatched = false;

  });
  const selectNoneImport = document.getElementById('selectNoneImport');
  if(selectNoneImport) selectNoneImport.addEventListener('click', ()=>{
    (window.__importPreview||[]).forEach(r=>r.__include=false); render();
  });
  const doImport = document.getElementById('doImport');
  if(doImport) doImport.addEventListener('click', ()=>{
    const rows = (window.__importPreview || []).filter(r=>r.__include!==false);
    let mergedCount=0;
    mutate(d=>{
      // Pass 1: for series that don't exist yet, find the earliest release date
      // among this batch's rows for that series — used to suffix "(YYYY)" onto
      // the series name on creation, matching the convention existing titles use.
      // Uses normalizeSeriesName (not raw string equality) so a row like "Power
      // Rangers Green" correctly recognizes "Power Rangers Green (2026)" as the
      // same series, instead of treating the year suffix as a difference.
      const newSeriesEarliestDate = {}; // normalized series name -> earliest YYYY-MM-DD
      rows.forEach(row=>{
        const key = row.seriesName.toLowerCase();
        const existsAlready = d.series.some(s=>normalizeSeriesName(s.name)===normalizeSeriesName(row.seriesName));
        if(!existsAlready && row.releaseDate){
          if(!newSeriesEarliestDate[key] || row.releaseDate < newSeriesEarliestDate[key]) newSeriesEarliestDate[key] = row.releaseDate;
        }
      });
      const newlyCreatedSeries = {}; // normalized series name -> series object, so later rows in this batch reuse it

      rows.forEach(row=>{
        const key = row.seriesName.toLowerCase();
        let series = d.series.find(s=>normalizeSeriesName(s.name)===normalizeSeriesName(row.seriesName)) || newlyCreatedSeries[key];
        if(!series){
          let name = row.seriesName;
          // Only append a year if the name doesn't already end with one (e.g. user typed "(2026)" themselves)
          if(!/\(\d{4}\)\s*$/.test(name)){
            const earliestDate = newSeriesEarliestDate[key];
            if(earliestDate) name = `${name} (${earliestDate.slice(0,4)})`;
          }
          // Re-check with the FINAL (possibly now year-suffixed) name — closes the gap where
          // appending the year makes it match an existing series that the earlier check, run
          // before suffixing, couldn't see.
          series = d.series.find(s=>normalizeSeriesName(s.name)===normalizeSeriesName(name)) || newlyCreatedSeries[key];
          if(!series){
            series = {id:uid(), name, publisher: row.publisher||'Unknown', status:'ongoing'};
            d.series.push(series);
          }
          newlyCreatedSeries[key] = series;
        } else if(row.publisher && series.publisher==='Unknown'){
          series.publisher = row.publisher;
        }
        const eventIds=[];
        (row.events||[]).forEach(evName=>{
          let ev = d.events.find(e=>e.name.toLowerCase()===evName.toLowerCase());
          if(!ev){ ev={id:uid(), name:evName, color: FALLBACK_COLORS[d.events.length % FALLBACK_COLORS.length]}; d.events.push(ev); }
          eventIds.push(ev.id);
        });
        const existing = d.issues.find(i=>i.seriesId===series.id && i.number.toLowerCase()===row.number.toLowerCase());
        if(existing){
          // merge: union event tags, fill blanks only, never touch read/purchased/dateHistory
          existing.eventIds = Array.from(new Set([...(existing.eventIds||[]), ...eventIds]));
          if(!existing.title && row.title) existing.title = row.title;
          if(!existing.releaseDate && row.releaseDate) existing.releaseDate = row.releaseDate;
          if(existing.readOrder==null && row.readOrder!=null) existing.readOrder = row.readOrder;
          mergedCount++;
        } else {
          d.issues.push({id:uid(), seriesId:series.id, number:row.number, title:row.title, releaseDate:row.releaseDate, dateHistory:[], eventIds, purchased:false, read:false, readOrder:row.readOrder});
        }
      });
    });
    window.__importDone = rows.length; window.__importMerged = mergedCount; window.__importPreview=[]; window.__importText=''; render();
  });
}
</script>
</body>
</html>
